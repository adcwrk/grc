objectives:
- Establish cybersecurity governance cadence, risk register ownership, and security roadmap
- Baseline the corporate IT cybersecurity program against NIST CSF 2.0
- Validate identity, endpoint, backup, vulnerability, incident response, and third-party
  risk practices
- Produce a prioritized roadmap with owners, target dates, and budget ranges
- Improve executive cyber risk reporting without unnecessary administrative burden
scope:
- IT governance, policy structure, and security program management
- Identity and access management for workforce users (Microsoft Entra ID)
- Microsoft 365 tenant and IT-managed SaaS administration
- Corporate endpoint fleet across four sites
- Site LAN, WAN, wireless, firewalls, VPN, DNS, DHCP, and network monitoring
- On-premises server infrastructure at headquarters
- Backup administration, vulnerability management, and incident response readiness
- Third-party risk for critical IT and SaaS vendors
- Security awareness training, IT asset management, and IT service desk processes
out_of_scope:
- Operational technology, ICS, PLCs, HMIs, SCADA, CNC controllers, plant-floor automation
- Safety systems, quality instrumentation networks, machine telemetry platforms
- Physical security systems except where dependent on corporate identity or network services
- Formal certification, attestation, or regulatory audit conclusions
- Penetration testing and technical security testing
- Remediation implementation and engineering labor
deliverables:
- D-1 Kickoff summary and open question log
- D-2 Current-state NIST CSF 2.0 profile for the IT environment
- D-3 Executive risk register
- D-4 Prioritized security roadmap covering the next two quarters
- D-5 Security governance calendar and recurring vCISO agenda
- D-6 Draft IT ransomware incident response tabletop scenario
